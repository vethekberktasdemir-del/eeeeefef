name: Build HBS Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Repoyu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bağımlılıkları kur
        run: py -m pip install --upgrade pyinstaller matplotlib

      - name: EXE derle
        shell: pwsh
        run: |
          py -m PyInstaller --noconfirm --clean --onefile --windowed --name HBS "HARCAMA DETAYLI.py"

      - name: EXE'yi yükle
        uses: actions/upload-artifact@v4
        with:
          name: HBS-exe
          path: dist/HBS.exe
